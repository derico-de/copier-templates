_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.indexer.yml

_plonecli:
  type: sub
  parent: backend_addon
  description: "Add a custom catalog indexer (@indexer function)"

_tasks:
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "validate"
      - "{{ _copier_conf.dst_path }}"
    when: "{{ _copier_conf.operation == 'copy' }}"
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "post_copy"
      - "{{ _copier_conf.dst_path }}"
      - "{{ indexer_name }}"

# Indexer name (snake_case, valid Python identifier)
indexer_name:
  type: str
  help: "Indexer name (snake_case, e.g. 'my_custom_index')"
  default: "my_custom_index"
  validator: "{% if not indexer_name %}Indexer name is required{% endif %}"

indexer_description:
  type: str
  help: "Short description of the indexer"
  default: "A custom catalog indexer"

# Package info - read from parent addon
package_name:
  type: str
  help: "Parent addon package name"

package_folder:
  type: str
  help: "Parent addon package folder (e.g., collective/mypackage)"
  default: "{{ package_name | replace('.', '/') }}"
