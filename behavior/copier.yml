_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.behavior.yml

_skip_if_exists:
  - "src/{{ package_folder }}/behaviors/__init__.py"

_plonecli:
  type: sub
  parent: backend_addon
  description: "Add a Dexterity behavior"

_tasks:
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "validate"
      - "{{ _copier_conf.dst_path }}"
    when: "{{ _copier_conf.operation == 'copy' }}"
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "post_copy"
      - "{{ _copier_conf.dst_path }}"
      - "{{ behavior_name }}"
      - "{{ behavior_interface }}"
      - "{{ behavior_module }}"
      - "{{ behavior_class }}"
      - "{{ behavior_description }}"
      - "{{ behavior_marker }}"
      - "{{ behavior_factory }}"

# Behavior name
behavior_name:
  type: str
  help: "Behavior interface name (e.g., 'IFeatured', 'ITaggable')"
  validator: "{% if not behavior_name %}Behavior name is required{% endif %}"

behavior_description:
  type: str
  help: "Short description of the behavior"
  default: "A custom Dexterity behavior"

# Package info - read from parent addon
package_name:
  type: str
  help: "Parent addon package name"

package_folder:
  type: str
  help: "Parent addon package folder (e.g., collective/mypackage)"
  default: "{{ package_name | replace('.', '/') }}"

# Behavior options
# Hidden by default — override with `--data behavior_marker=false` etc. if not desired.
behavior_marker:
  type: bool
  help: "Create a marker interface?"
  default: true
  when: false

behavior_factory:
  type: bool
  help: "Create a behavior factory/adapter?"
  default: true
  when: false

# Computed values
behavior_interface:
  type: str
  default: "{{ behavior_name if behavior_name.startswith('I') else 'I' + behavior_name }}"
  when: false

behavior_class:
  type: str
  default: "{{ behavior_interface[1:] if behavior_interface.startswith('I') else behavior_interface }}"
  when: false

# Computed: PascalCase class -> snake_case module (bobtemplates layout:
# my_behavior.py, not imybehavior.py)
behavior_module:
  type: str
  default: >-
    {%- set ns = namespace(out='') -%}
    {%- for ch in behavior_class -%}
    {%- if ch.isupper() and ns.out -%}
    {%- set ns.out = ns.out + '_' + ch|lower -%}
    {%- else -%}
    {%- set ns.out = ns.out + ch|lower -%}
    {%- endif -%}
    {%- endfor -%}
    {{ ns.out }}
  when: false
