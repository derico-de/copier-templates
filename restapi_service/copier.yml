_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.restapi-service.yml

_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions.py:ServiceForInterfacesHook

_plonecli:
  type: sub
  parent: backend_addon
  description: "Add a REST API endpoint"

_tasks:
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "validate"
      - "{{ _copier_conf.dst_path }}"
    when: "{{ _copier_operation == 'copy' }}"
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "post_copy"
      - "{{ _copier_conf.dst_path }}"
      - "{{ service_name }}"
      - "{{ service_module }}"
      - "{{ service_endpoint }}"

# Service name
service_name:
  type: str
  help: "Service endpoint name (e.g., 'stats', 'my-endpoint')"
  validator: "{% if not service_name %}Service name is required{% endif %}"

service_description:
  type: str
  help: "Short description of the service"
  default: "A custom REST API endpoint"

# Package info - read from parent addon
package_name:
  type: str
  help: "Parent addon package name"

package_folder:
  type: str
  help: "Parent addon package folder (e.g., collective/mypackage)"
  default: "{{ package_name | replace('.', '/') }}"

# Expandable element
expandable:
  type: bool
  help: "Add IExpandableElement adapter (extends existing endpoints like @search)?"
  default: false

# HTTP methods
http_get:
  type: bool
  help: "Support GET requests?"
  default: true

http_post:
  type: bool
  help: "Support POST requests?"
  default: false

http_patch:
  type: bool
  help: "Support PATCH requests?"
  default: false

http_delete:
  type: bool
  help: "Support DELETE requests?"
  default: false

# Context — the interface the service is registered for. Choices are the
# default Plone interfaces plus any content type interfaces found in this
# package, with "<enter manually>" to type a custom dotted name.
service_for:
  type: str
  help: "Context interface the service is registered for"
  default: "plone.dexterity.interfaces.IDexterityContainer"
  choices: "{{ service_for_choices }}"

service_for_manual:
  type: str
  help: "Custom interface dotted name (e.g. 'my.package.interfaces.IFoo')"
  default: ""
  when: "{{ service_for == '<enter manually>' }}"
  validator: "{% if not service_for_manual %}Custom interface is required{% endif %}"

# Computed: resolve service_for to the final interface string
service_for_resolved:
  type: str
  default: "{{ service_for_manual if service_for == '<enter manually>' else service_for }}"
  when: false

# Computed values
service_module:
  type: str
  default: "{{ service_name | lower | replace('-', '_') | replace(' ', '_') }}"
  when: false

# Computed: PascalCase base name; per-verb classes append Get/Post/... (
# bobtemplates naming: StatsGet, StatsPost)
service_class:
  type: str
  default: "{{ service_name | replace('-', ' ') | replace('_', ' ') | title | replace(' ', '') }}"
  when: false

service_endpoint:
  type: str
  default: "@{{ service_name | lower | replace('_', '-') | replace(' ', '-') }}"
  when: false
